name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
